services:
  jabba-app:
    build: .
    image: jabba-app:local
    container_name: jabba-app
    env_file: .env
    # Réseau de Jabba, mais écoute seulement sur 127.0.0.1:8090 :
    # on n'y entre que par Tailscale (tailscale serve).
    network_mode: host
    # Aucun droit sur le serveur : toute action passe par le service jabba-hote (liste fermée).
    # Il garde seulement de quoi écrire dans /srv au nom du compte du serveur (CHOWN, DAC_OVERRIDE,
    # FOWNER) et lancer ffmpeg et Pillow sans droits (SETUID, SETGID, SETPCAP, KILL : bac_a_sable.py).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP, KILL]
    security_opt:
      - no-new-privileges:true
    # La carte graphique, pour le lecteur vidéo (JABBA_GPU dans .env, posé à l'installation
    # s'il y en a une). Sans elle : un appareil inutile, et la vidéo est convertie sans elle.
    devices:
      - "${JABBA_GPU:-/dev/null}:${JABBA_GPU:-/dev/jabba-sans-gpu}"
    depends_on: [jabba-hote]
    volumes:
      - ./donnees:/data
      # La prise du service privilégié (liste fermée des actions sur le serveur).
      - /run/jabba:/run/jabba
      # Les dossiers du serveur, pour l'écran Fichiers quand Nextcloud est désactivé.
      - type: bind
        source: /srv
        target: /srv
        bind:
          propagation: rslave
    restart: unless-stopped

  # Le service privilégié : le seul à agir sur le serveur, et seulement par une liste fermée
  # d'actions (app/host/actions.py). Aucun réseau ; il n'écoute que sur une prise locale
  # (/run/jabba/hote.sock) partagée avec l'appli, qui, elle, n'a aucun droit (recommandation ANSSI).
  jabba-hote:
    image: jabba-app:local
    container_name: jabba-hote
    command: ["python", "-m", "host.host_service"]
    network_mode: none
    pid: host
    privileged: true
    volumes:
      - /run/jabba:/run/jabba
    restart: unless-stopped

  # La porte du Wi-Fi : la page invités (http://<serveur>.local), sans aucun pouvoir.
  # Compte du serveur (pas root), aucune capacité Linux, fichiers de l'appli en lecture seule.
  # Elle ne voit que /srv (les dossiers partagés aux invités) et donnees/porte-wifi/ (son état),
  # jamais le reste des données de l'appli (comptes, clés, sessions, sauvegardes).
  jabba-invites:
    image: jabba-app:local
    container_name: jabba-invites
    depends_on: [jabba-app]
    command: ["uvicorn", "guest_door:app", "--host", "0.0.0.0", "--port", "8080", "--no-server-header", "--log-level", "warning"]
    user: "${JABBA_UID:-1000}:${JABBA_GID:-1000}"
    ports:
      - "${PORT_WIFI:-80}:8080"
    environment:
      - JABBA_INVITES_ETAT=/etat/etat.json
      - JABBA_JOURNAL=/etat/journal.jsonl
      - JABBA_JOURNAUX_AUTRES=
      - HOME=/tmp
    volumes:
      - ./donnees/porte-wifi:/etat
      - type: bind
        source: /srv
        target: /srv
        bind:
          propagation: rslave
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
