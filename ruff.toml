# Style du code Python de Jabba : lisible, une instruction par ligne.
line-length = 120
target-version = "py312"

[format]
quote-style = "double"

[lint]
# F : erreurs (noms inconnus, imports inutiles) ; E7 : une instruction par ligne ; B : pièges courants.
select = ["F", "E7", "E9", "I", "B006", "B023"]
ignore = ["B008"]

[lint.per-file-ignores]
# Dans les tests, de petites fonctions écrites en une ligne (lambda) restent lisibles.
"tests/*" = ["E731"]

[lint.isort]
known-first-party = ["config", "watchers", "main", "guest_door", "version", "host", "routes", "security", "services"]
